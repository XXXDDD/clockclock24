name: Validate TIMEFORM workbench and wallpaper
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: TIMEFORM-wallpapers
          path: downloads/
