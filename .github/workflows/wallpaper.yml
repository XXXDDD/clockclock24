name: Validate Shizhen releases
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Offline Android assets are reproducible without signing keys or an SDK.
      - run: npm run build:android
      - run: npm test
      - run: npm run check:all
