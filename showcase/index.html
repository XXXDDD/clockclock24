<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeece6">
  <script>
    (() => {
      let theme;
      try { theme = localStorage.getItem('timeform.gallery.theme'); } catch {}
      if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#4b4b4b' : '#eeece6';
    })();
  </script>
  <title>TIMEFORM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23eeece6'/%3E%3Cpath d='M16 6v10l7 5' fill='none' stroke='%23333732' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="gallery.css">
  <script defer src="/runtime/timeform.js"></script>
  <script defer src="presentation.js"></script>
  <script defer src="gallery.js"></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><rect x="14" y="14" width="6" height="6" rx="1.2"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></symbol>
    <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></symbol>
    <symbol id="i-landscape" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="10" rx="1"/></symbol>
    <symbol id="i-portrait" viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="18" rx="1"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z"/></symbol>
    <symbol id="i-replay" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-error" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 3v.1"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/></symbol>
    <symbol id="i-windows" viewBox="0 0 24 24"><path d="M3 3h8v8H3Zm10 0h8v8h-8ZM3 13h8v8H3Zm10 0h8v8h-8Z" fill="currentColor" stroke="none"/></symbol>
  </svg>

  <header class="topbar">
    <button class="icon-button collection-button" id="open-collection" aria-label="浏览全部时钟" aria-haspopup="dialog">
      <svg><use href="#i-grid"/></svg>
    </button>
    <button class="icon-button download-button" id="open-downloads" type="button" popovertarget="downloads-popover" aria-label="选择壁纸包" aria-haspopup="dialog" aria-expanded="false">
      <svg><use href="#i-download"/></svg>
    </button>
  </header>

  <div class="downloads-panel" id="downloads-popover" popover="auto" role="dialog" aria-label="下载 Windows 壁纸包">
    <div class="download-platform" aria-label="Windows"><svg aria-hidden="true"><use href="#i-windows"/></svg></div>
    <div class="download-options">
      <a class="download-option" href="https://github.com/XXXDDD/clockclock24/releases/download/v3.2.0/TIMEFORM-Lively.zip" download="TIMEFORM-Lively.zip" aria-label="下载 Lively 壁纸包">
        <img src="assets/lively.webp" alt="" width="42" height="42" aria-hidden="true">
        <svg class="package-arrow" aria-hidden="true"><use href="#i-download"/></svg>
      </a>
      <a class="download-option" href="https://github.com/XXXDDD/clockclock24/releases/download/v3.2.0/TIMEFORM-WallpaperEngine.zip" download="TIMEFORM-WallpaperEngine.zip" aria-label="下载 Wallpaper Engine 壁纸包">
        <img src="assets/wallpaper-engine.svg" alt="" width="42" height="42" aria-hidden="true">
        <svg class="package-arrow" aria-hidden="true"><use href="#i-download"/></svg>
      </a>
    </div>
  </div>

  <main class="gallery" aria-label="时钟展厅" aria-busy="true">
    <div class="stage" id="stage">
      <div class="artboard" id="artboard"><canvas id="clock" role="img" aria-label="动态时钟"></canvas></div>
      <div class="swatches" id="swatches" role="group" aria-label="时钟版本"></div>
    </div>
    <nav class="model-navigation" aria-label="切换时钟尺寸">
      <button class="model-neighbor" id="previous" aria-label="上一个型号"></button>
      <button class="model-neighbor" id="next" aria-label="下一个型号"></button>
    </nav>
    <div class="error-state" id="error-state" hidden role="alert" aria-label="时钟加载失败，请重试">
      <svg><use href="#i-error"/></svg>
      <button class="icon-button" id="retry" aria-label="重试"><svg><use href="#i-replay"/></svg></button>
    </div>
  </main>

  <footer class="bottom-bar">
    <div class="playback">
      <button class="icon-button quiet" id="playback" aria-label="暂停动画" aria-pressed="false"><svg><use href="#i-pause"/></svg></button>
      <button class="icon-button quiet" id="replay" aria-label="重播动画"><svg><use href="#i-replay"/></svg></button>
    </div>
    <nav class="shape-switch" aria-label="时钟形状">
      <button class="shape-button" data-category="circular" aria-label="圆形" aria-pressed="false"><svg><use href="#i-circle"/></svg></button>
      <button class="shape-button" data-category="landscape" aria-label="横向" aria-pressed="true"><svg><use href="#i-landscape"/></svg></button>
      <button class="shape-button" data-category="portrait" aria-label="竖向" aria-pressed="false"><svg><use href="#i-portrait"/></svg></button>
    </nav>
    <button class="icon-button quiet theme-toggle" id="theme-toggle" type="button" aria-label="切换明暗背景" aria-pressed="false"><svg><use href="#i-sun"/></svg></button>
  </footer>

  <dialog class="collection" id="collection" aria-label="全部时钟">
    <button class="icon-button close-collection" id="close-collection" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
    <div class="collection-grid" id="collection-grid"></div>
  </dialog>
</body>
</html>
